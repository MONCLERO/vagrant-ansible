---
- name: Install and configure Apache Web Server
  hosts: webserver
  become: yes

  tasks:
    - name: Update apt package cache
      apt:
        update_cache: yes

    - name: Install Apache
      apt:
        name: apache2
        state: present

    - name: Start and enable Apache service
      service:
        name: apache2
        state: started
        enabled: yes

    - name: Deploy custom index.html
      copy:
        dest: /var/www/html/index.html
        content: '<h1 style="text-align: center;">Ansible Playbook by Meshach CY!</h1>'

